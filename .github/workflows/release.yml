name: Create Release Tarball

on:
  release:
    types:
    - published

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for github release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      
      - name: Create tarball and checksum
        run: |
          TARBALL_NAME="vagrant-k3s-${{ github.ref_name }}.tar.gz"
          
          # Create tarball excluding .git, .vagrant, and other temporary files
          tar --exclude='.git' \
              -czf ../"${TARBALL_NAME}" \
              -C .. \
              $(basename $PWD)

          mv ../"${TARBALL_NAME}" .
          sha256sum "${TARBALL_NAME}" > "${TARBALL_NAME}.sha256"
      
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL_NAME="vagrant-k3s-${{ github.ref_name }}.tar.gz"

          if gh release view ${{ github.ref_name }} > /dev/null; then
            echo ${{ github.ref_name }} release exists
          else
            gh release create ${{ github.ref_name }} --notes "Release for ${{ github.ref_name }}"
          fi
          gh release upload ${{ github.ref_name }} "${TARBALL_NAME}"
          gh release upload ${{ github.ref_name }} "${TARBALL_NAME}.sha256"
